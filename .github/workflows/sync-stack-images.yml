name: Sync HQ stack images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python + cwebp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          python3 -m pip install -q Pillow

      - name: Build HQ webps into public/stack
        run: python3 scripts/sync_stack_hq_images.py

      - name: Commit and push binaries
        run: |
          git config user.name "bjbeyond81"
          git config user.email "bj_beyond@tutamail.com"
          git add public/stack
          if git diff --cached --quiet; then
            echo "No image changes"
            exit 0
          fi
          git commit -m "chore(stack): HQ webp binaries (>=1200px, q80) from official CDNs"
          git push
